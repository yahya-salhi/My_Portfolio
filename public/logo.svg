<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" role="img" aria-labelledby="title desc">
  <title id="title">Yahya Salhi — AI Engineer &amp; Full-Stack Developer</title>
  <desc id="desc">Minimal YS monogram with circuit-inspired details and the name Yahya Salhi.</desc>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Monogram -->
  <g transform="translate(5 8)" fill="none" stroke="url(#blue)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 17 L39 17 L52 30 L66 16 L82 16 L59 39 L59 63 L43 63 L43 39 Z"
          fill="url(#blue)" stroke="none"/>
    <path d="M66 16 L82 16 L69 29 L53 29" stroke="#06b6d4" stroke-width="2.5"/>
    <path d="M16 25 H4 M16 37 H2 M18 49 H7" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="3" cy="25" r="2.8" fill="#06b6d4" stroke="none"/>
    <circle cx="1" cy="37" r="2.8" fill="#06b6d4" stroke="none"/>
    <circle cx="6" cy="49" r="2.8" fill="#06b6d4" stroke="none"/>
    <path d="M28 60 L21 68 M35 60 L30 68" stroke="#7c3aed" stroke-width="2.5"/>
    <path d="M25 67 L21 71 M34 67 L38 71" stroke="#06b6d4" stroke-width="2"/>
  </g>

  <!-- Divider -->
  <path d="M105 16 V64" stroke="url(#blue)" stroke-width="2" opacity=".65"/>

  <!-- Wordmark -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="124" y="49" font-size="32" font-weight="700" letter-spacing="-1.2">
      <tspan fill="#f1f5f9">Yahya</tspan><tspan fill="url(#blue)"> Salhi</tspan>
    </text>
    <text x="126" y="65" font-size="7.5" font-weight="600" letter-spacing="2.1" fill="#94a3b8">
      AI ENGINEER · FULL-STACK DEVELOPER
    </text>
  </g>

  <!-- Technical underline -->
  <path d="M125 72 H390" stroke="url(#blue)" stroke-width="1.5"/>
  <circle cx="394" cy="72" r="3.2" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
</svg>
